<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Runner - Feria de Ciencias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Urban Runner</h1>
    <div class="score-board">
      Puntaje: <span id="score">0</span>
    </div>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="controls-hint">
      <p>Presiona <strong>Espacio</strong>, <strong>Flecha Arriba</strong> o <strong>Toca la pantalla</strong> para Saltar</p>
      <button id="startBtn">Iniciar / Reiniciar Juego</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
